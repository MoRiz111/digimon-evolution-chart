<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digimon Evolution Chart</title>

    <link rel="stylesheet" href="./css/style.css">

</head>


<body>

    <header class="header">

        <h1>Digimon Evolution Chart</h1>

        <p>
            Click a Digimon to reveal its evolution paths.
        </p>

    </header>


    <main>

        <div class="controls">

            <button id="resetButton">
                Reset Chart
            </button>

        </div>


        <section id="chart" class="chart">

            <!-- JavaScript will generate the chart here -->

        </section>

    </main>


    <!--
        type="module" allows us to use
        import / export between JavaScript files.
    -->
    <script
        type="module"
        src="./js/app.js">
    </script>

</body>

</html>
